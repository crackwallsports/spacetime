  <script>
(() => {
  const currentPath = window.location.pathname;
  const pagesMarker = currentPath.indexOf("/Pages/");
  const specialPath = ["/Now.html", "/Archive.html", "/Projects.html", "/About.html"].find((path) => currentPath.endsWith(path));
  const basePath = pagesMarker >= 0
    ? currentPath.slice(0, pagesMarker)
    : specialPath
      ? currentPath.slice(0, -specialPath.length)
      : currentPath.endsWith("/") ? currentPath.slice(0, -1) : currentPath;
  const sitePath = (pathname) => {
    if (basePath && pathname.startsWith(basePath + "/")) return pathname.slice(basePath.length) || "/";
    return pathname;
  };
  const previousLabel = (referrer) => {
    try {
      const previous = new URL(referrer);
      if (previous.origin !== window.location.origin) return "NOW";
      return ({ "/Now.html": "NOW", "/Archive.html": "ARCHIVE", "/Projects.html": "PROJECTS", "/About.html": "ABOUT", "/": "HOME" })[sitePath(previous.pathname)] || "BACK";
    } catch {
      return "NOW";
    }
  };
  const returnLink = document.querySelector("[data-rabbit-return]");
  if (returnLink) returnLink.textContent = "← " + previousLabel(document.referrer);
  document.querySelectorAll(".site-header nav a").forEach((link) => {
    try {
      if (sitePath(new URL(link.href).pathname) === sitePath(currentPath)) link.setAttribute("aria-current", "page");
    } catch {}
  });
  document.addEventListener("click", (event) => {
    const link = event.target instanceof Element ? event.target.closest("[data-rabbit-return]") : null;
    if (!link || !document.referrer) return;
    try {
      const previous = new URL(document.referrer);
      if (previous.origin === window.location.origin) {
        event.preventDefault();
        window.history.back();
      }
    } catch {}
  });
})();
</script>
  <script>
const bindGalleryCarousel = function bindGalleryCarousel(gallery) {
  const track = gallery.querySelector(".page-gallery-track");
  const previous = gallery.querySelector("[data-gallery-prev]");
  const next = gallery.querySelector("[data-gallery-next]");
  const counter = gallery.querySelector("[data-gallery-counter]");
  if (!(track instanceof HTMLElement) || !(previous instanceof HTMLButtonElement) || !(next instanceof HTMLButtonElement) || !(counter instanceof HTMLElement)) return () => {};

  const slides = Array.from(track.querySelectorAll(".page-gallery-slide"));
  if (slides.length < 2) return () => {};

  let activeIndex = Math.max(0, slides.findIndex((slide) => slide.classList.contains("is-active")));
  let scrollTimer = 0;
  const update = (index = activeIndex) => {
    activeIndex = index;
    slides.forEach((slide, slideIndex) => {
      const active = slideIndex === index;
      slide.classList.toggle("is-active", active);
      slide.setAttribute("aria-hidden", String(!active));
      if (active) slide.removeAttribute("inert");
      else slide.setAttribute("inert", "");
    });
    previous.disabled = index === 0;
    next.disabled = index === slides.length - 1;
    counter.textContent = `${index + 1} / ${slides.length}`;
  };
  const go = (direction) => {
    const targetIndex = Math.max(0, Math.min(slides.length - 1, activeIndex + direction));
    if (targetIndex === activeIndex) return;
    const target = slides[targetIndex];
    const left = target.getBoundingClientRect().left - track.getBoundingClientRect().left + track.scrollLeft;
    const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
    update(targetIndex);
    track.scrollTo({ left, behavior: reducedMotion ? "auto" : "smooth" });
  };
  const handleScroll = () => {
    window.clearTimeout(scrollTimer);
    scrollTimer = window.setTimeout(() => {
      const trackLeft = track.getBoundingClientRect().left;
      const index = slides.reduce((closestIndex, slide, slideIndex) => {
        const closestDistance = Math.abs(slides[closestIndex].getBoundingClientRect().left - trackLeft);
        const distance = Math.abs(slide.getBoundingClientRect().left - trackLeft);
        return distance < closestDistance ? slideIndex : closestIndex;
      }, 0);
      update(index);
    }, 90);
  };
  const handleKeyDown = (event) => {
    if (event.target instanceof HTMLButtonElement) return;
    if (event.key === "ArrowLeft") { event.preventDefault(); go(-1); }
    else if (event.key === "ArrowRight") { event.preventDefault(); go(1); }
  };
  const handlePrevious = () => go(-1);
  const handleNext = () => go(1);

  track.addEventListener("scroll", handleScroll, { passive: true });
  gallery.addEventListener("keydown", handleKeyDown);
  previous.addEventListener("click", handlePrevious);
  next.addEventListener("click", handleNext);
  update();

  return () => {
    window.clearTimeout(scrollTimer);
    track.removeEventListener("scroll", handleScroll);
    gallery.removeEventListener("keydown", handleKeyDown);
    previous.removeEventListener("click", handlePrevious);
    next.removeEventListener("click", handleNext);
  };
};
(() => {
  let lightbox;
  const closeLightbox = () => {
    if (!lightbox) return;
    lightbox.close();
  };
  const openLightbox = (image) => {
    if (!lightbox) {
      lightbox = document.createElement('dialog');
      lightbox.className = 'page-image-lightbox';
      lightbox.innerHTML = '<button type="button" class="page-image-lightbox-close" aria-label="Close image">×</button>'
        + '<div class="page-image-lightbox-toolbar" role="toolbar" aria-label="Image view controls">'
        + '<button type="button" data-image-zoom-out aria-label="Zoom out">−</button>'
        + '<input type="range" data-image-zoom-range min="1" max="4" step="0.25" value="1" aria-label="Image zoom">'
        + '<output data-image-zoom-value>100%</output>'
        + '<button type="button" data-image-zoom-in aria-label="Zoom in">+</button>'
        + '<button type="button" data-image-fit aria-label="Fit image to window">Fit</button></div>'
        + '<div class="page-image-lightbox-stage" tabindex="0" aria-label="Image canvas">'
        + '<div class="page-image-lightbox-canvas"><img alt=""></div></div>';
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      const stage = lightbox.querySelector('.page-image-lightbox-stage');
      const canvas = lightbox.querySelector('.page-image-lightbox-canvas');
      const preview = lightbox.querySelector('.page-image-lightbox-canvas img');
      const zoomRange = lightbox.querySelector('[data-image-zoom-range]');
      const zoomValue = lightbox.querySelector('[data-image-zoom-value]');
      const zoomOut = lightbox.querySelector('[data-image-zoom-out]');
      const zoomIn = lightbox.querySelector('[data-image-zoom-in]');
      const fit = lightbox.querySelector('[data-image-fit]');
      let zoom = 1;
      let fitScale = 1;
      const updateControls = () => {
        zoomRange.value = String(zoom);
        zoomValue.value = String(Math.round(zoom * 100)) + '%';
        zoomValue.textContent = String(Math.round(zoom * 100)) + '%';
        zoomRange.setAttribute('aria-valuetext', String(Math.round(zoom * 100)) + '%');
        zoomOut.disabled = zoom <= 1;
        zoomIn.disabled = zoom >= 4;
      };
      const updateLayout = (preserveCenter = true) => {
        if (!preview.naturalWidth || !preview.naturalHeight) return;
        const style = getComputedStyle(stage);
        const horizontalPadding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
        const verticalPadding = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
        const availableWidth = Math.max(1, stage.clientWidth - horizontalPadding);
        const availableHeight = Math.max(1, stage.clientHeight - verticalPadding);
        fitScale = Math.min(availableWidth / preview.naturalWidth, availableHeight / preview.naturalHeight);
        const oldCanvasWidth = canvas.clientWidth || stage.clientWidth;
        const oldCanvasHeight = canvas.clientHeight || stage.clientHeight;
        const oldCenterX = stage.scrollLeft + stage.clientWidth / 2;
        const oldCenterY = stage.scrollTop + stage.clientHeight / 2;
        const imageWidth = Math.max(1, Math.round(preview.naturalWidth * fitScale * zoom));
        const imageHeight = Math.max(1, Math.round(preview.naturalHeight * fitScale * zoom));
        preview.style.width = imageWidth + 'px';
        preview.style.height = imageHeight + 'px';
        canvas.style.width = Math.max(availableWidth, imageWidth) + 'px';
        canvas.style.height = Math.max(availableHeight, imageHeight) + 'px';
        if (preserveCenter) {
          const centerX = oldCanvasWidth ? oldCenterX / oldCanvasWidth : 0.5;
          const centerY = oldCanvasHeight ? oldCenterY / oldCanvasHeight : 0.5;
          stage.scrollLeft = Math.max(0, Math.min(stage.scrollWidth - stage.clientWidth, centerX * canvas.scrollWidth - stage.clientWidth / 2));
          stage.scrollTop = Math.max(0, Math.min(stage.scrollHeight - stage.clientHeight, centerY * canvas.scrollHeight - stage.clientHeight / 2));
        } else {
          stage.scrollLeft = Math.max(0, (stage.scrollWidth - stage.clientWidth) / 2);
          stage.scrollTop = Math.max(0, (stage.scrollHeight - stage.clientHeight) / 2);
        }
        updateControls();
      };
      const setZoom = (value, preserveCenter = true) => {
        zoom = Math.max(1, Math.min(4, Math.round(value * 4) / 4));
        updateLayout(preserveCenter);
      };
      const changeZoom = (amount) => setZoom(zoom + amount);
      lightbox.querySelector('.page-image-lightbox-close').addEventListener('click', closeLightbox);
      zoomOut.addEventListener('click', () => changeZoom(-0.25));
      zoomIn.addEventListener('click', () => changeZoom(0.25));
      fit.addEventListener('click', () => setZoom(1, false));
      zoomRange.addEventListener('input', () => setZoom(Number(zoomRange.value)));
      stage.addEventListener('wheel', (event) => {
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        changeZoom(event.deltaY > 0 ? -0.25 : 0.25);
      }, { passive: false });
      stage.addEventListener('keydown', (event) => {
        if (event.key === '+' || event.key === '=') { event.preventDefault(); changeZoom(0.25); }
        else if (event.key === '-') { event.preventDefault(); changeZoom(-0.25); }
        else if (event.key === '0') { event.preventDefault(); setZoom(1, false); }
      });
      preview.addEventListener('load', () => updateLayout(false));
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => updateLayout()).observe(stage);
      lightbox.addEventListener('cancel', closeLightbox);
      document.body.append(lightbox);
    }
    const preview = lightbox.querySelector('.page-image-lightbox-canvas img');
    preview.src = image.currentSrc || image.src;
    preview.alt = image.alt;
    lightbox.querySelector('[data-image-zoom-range]').value = '1';
    lightbox.querySelector('[data-image-zoom-range]').dispatchEvent(new Event('input'));
    if (!lightbox.open) lightbox.showModal();
    lightbox.querySelector('button').focus();
  };
  const bindImageLightbox = () => {
    document.querySelectorAll('.single-page .page-image-target').forEach((image) => {
      image.addEventListener('click', () => openLightbox(image));
      image.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLightbox(image);
        }
      });
    });
  };
  const bindNowImages = () => {
    document.querySelectorAll('.now-card-media img').forEach((image) => {
      const markFailed = () => {
        const item = image.closest('.now-card-media-item');
        if (!item) return;
        item.classList.add('is-image-error');
        image.hidden = true;
        const fallback = item.querySelector('.now-card-media-fallback');
        if (fallback) fallback.hidden = false;
      };
      image.addEventListener('error', markFailed, { once: true });
      if (image.complete && image.naturalWidth === 0) markFailed();
    });
  };
  const bindPageReading = () => {
    const tocLinks = [...document.querySelectorAll('.page-toc a[href^="#"]')];
    tocLinks.forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        const target = document.getElementById(link.getAttribute('href').slice(1));
        let section = target?.closest('details.page-section');
        while (section) {
          section.open = true;
          section = section.parentElement?.closest('details.page-section') ?? null;
        }
        if (target) {
          window.history.replaceState(null, '', link.getAttribute('href'));
          const behavior = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
          target.scrollIntoView({ behavior, block: 'start' });
        }
      });
    });
    const tocIds = new Set(tocLinks.map((link) => link.getAttribute('href')?.slice(1)).filter(Boolean));
    const headings = [...document.querySelectorAll('.page-reading-main h1, .page-reading-main h2, .page-reading-main h3, .page-reading-main h4, .page-reading-main h5, .page-reading-main h6')].filter((heading) => tocIds.has(heading.id));
    const scrollBehavior = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
    const keepTocLinkInView = (link) => {
      const container = link.closest('.page-reading-sidebar');
      if (!container || container.scrollHeight <= container.clientHeight) return;
      const linkRect = link.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();
      const padding = 8;
      if (linkRect.top < containerRect.top + padding) container.scrollTop -= containerRect.top + padding - linkRect.top;
      else if (linkRect.bottom > containerRect.bottom - padding) container.scrollTop += linkRect.bottom - (containerRect.bottom - padding);
    };
    let lastActiveLink;
    const headingIsVisible = (heading) => {
      if (!heading.getClientRects().length) return false;
      let section = heading.closest('details.page-section');
      if (section?.querySelector(':scope > summary')?.contains(heading)) section = section.parentElement?.closest('details.page-section') ?? null;
      while (section) {
        if (!section.open) return false;
        section = section.parentElement?.closest('details.page-section') ?? null;
      }
      return true;
    };
    const setActiveHeading = () => {
      const visibleHeadings = headings.filter(headingIsVisible);
      const current = visibleHeadings.filter((heading) => heading.getBoundingClientRect().top <= 120).at(-1) ?? visibleHeadings[0];
      const activeLink = current ? tocLinks.find((link) => link.getAttribute('href') === '#' + current.id) : undefined;
      tocLinks.forEach((link) => {
        const active = current && link.getAttribute('href') === '#' + current.id;
        link.parentElement.classList.toggle('is-active', Boolean(active));
        if (active) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
      if (activeLink && activeLink.getClientRects().length && activeLink !== lastActiveLink) {
        keepTocLinkInView(activeLink);
        lastActiveLink = activeLink;
      } else if (!activeLink) {
        lastActiveLink = undefined;
      }
    };
    window.addEventListener('scroll', setActiveHeading, { passive: true });
    setActiveHeading();
    bindImageLightbox();
    document.querySelectorAll('.single-page .page-gallery').forEach(bindGalleryCarousel);
    bindNowImages();
    const tocMobileToggle = document.querySelector('.page-toc-mobile-toggle');
    const tocList = document.getElementById('page-toc-list');
    if (tocMobileToggle && tocList) {
      tocMobileToggle.addEventListener('click', () => {
        const expanded = tocList.hidden;
        tocList.hidden = !expanded;
        tocMobileToggle.textContent = expanded ? 'Hide outline' : 'Show outline';
        tocMobileToggle.setAttribute('aria-expanded', String(expanded));
      });
    }
    const tocToggle = document.querySelector('.page-toc-toggle');
    const sections = [...document.querySelectorAll('details.page-section')];
    if (tocToggle && sections.length) {
      const updateTocToggle = () => {
        const allOpen = sections.every((section) => section.open);
        tocToggle.textContent = allOpen ? 'Collapse all' : 'Expand all';
        tocToggle.setAttribute('aria-label', allOpen ? 'Collapse all sections' : 'Expand all sections');
      };
      tocToggle.addEventListener('click', () => {
        const open = !sections.every((section) => section.open);
        sections.forEach((section) => { section.open = open; });
        updateTocToggle();
      });
      const updateReadingState = () => {
        updateTocToggle();
        setActiveHeading();
      };
      sections.forEach((section) => section.addEventListener('toggle', updateReadingState));
      updateTocToggle();
    }
    const copyLink = document.querySelector('.page-copy-link');
    if (copyLink) {
      const defaultLabel = copyLink.textContent || '↗';
      let resetCopyFeedback;
      const copyPageLink = async () => {
        let copied = false;
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(window.location.href);
            copied = true;
          } catch {}
        }
        if (!copied) {
          const helper = document.createElement('textarea');
          helper.value = window.location.href;
          helper.setAttribute('readonly', '');
          helper.style.position = 'fixed';
          helper.style.opacity = '0';
          document.body.append(helper);
          helper.select();
          try { copied = document.execCommand('copy'); } catch {}
          helper.remove();
        }
        copyLink.textContent = copied ? '✓' : '!';
        copyLink.setAttribute('aria-label', copied ? 'Link copied' : 'Copy failed');
        copyLink.setAttribute('title', copied ? 'Link copied' : 'Copy failed');
        clearTimeout(resetCopyFeedback);
        resetCopyFeedback = setTimeout(() => {
          copyLink.textContent = defaultLabel;
          copyLink.setAttribute('aria-label', 'Copy page link');
          copyLink.setAttribute('title', 'Copy page link');
        }, 1600);
      };
      copyLink.addEventListener('click', copyPageLink);
    }
    const backToTop = document.querySelector('.back-to-top');
    if (backToTop) {
      const updateBackToTop = () => { backToTop.hidden = window.scrollY < window.innerHeight * 0.8; };
      backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: scrollBehavior() }));
      window.addEventListener('scroll', updateBackToTop, { passive: true });
      updateBackToTop();
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindPageReading, { once: true });
  else bindPageReading();
})();

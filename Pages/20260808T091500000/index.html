  <script>
(() => {
  document.addEventListener("click", (event) => {
    const link = event.target instanceof Element ? event.target.closest("[data-rabbit-return-now]") : null;
    if (!link || !document.referrer) return;
    try {
      const previous = new URL(document.referrer);
      if (previous.origin === window.location.origin && previous.pathname === "/spacetime/Now.html") {
        event.preventDefault();
        window.history.back();
      }
    } catch {}
  });
})();
</script>

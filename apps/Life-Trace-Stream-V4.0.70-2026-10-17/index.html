<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trace">
  <title>Life Trace · Stream</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css?v=70">
  <script>
    (()=>{
      const mq=window.matchMedia('(prefers-color-scheme: light)');
      const sync=()=>document.documentElement.dataset.theme=mq.matches?'light':'dark';
      sync();
      try{mq.addEventListener('change',()=>{sync();window.__onThemeChange?.();});}
      catch(_){mq.addListener(()=>{sync();window.__onThemeChange?.();});}
    })();
  </script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">●</span><span>Life Trace</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="settingsBtn" type="button" data-i18n-aria-label="settingsButton" aria-label="设置">•••</button>
      </div>
    </header>

    <section class="stream-section">
      <div class="stream-head">
        <div class="stream-title"><h1>STREAM</h1><span class="stream-date" id="streamDate"></span></div>
        <div class="day-nav" id="dayNav"></div>
        <div class="history-picker" id="historyPicker" hidden>
          <span data-i18n="historyDate">历史日期</span>
          <input id="historyDate" type="date">
          <button class="plain-x" id="historyClose" type="button">×</button>
        </div>
      </div>
      <div class="stream" id="stream"></div>
      <aside class="quick-tools" id="quickTools" aria-live="polite">
        <div class="quick-tools-panel" id="quickToolsPanel" hidden>
          <div class="quick-tools-status"><span class="live-dot" id="liveDot"></span><div><strong id="nowState">未记录</strong><div class="now-meta" id="nowMeta">点一个 State 开始</div></div><span class="now-duration" id="nowDuration">—</span><button class="stop-btn" id="stopBtn" type="button" data-i18n="stopRecording" hidden>停止记录</button></div>
          <div class="state-strip" id="stateStrip" data-i18n-aria-label="switchState" aria-label="切换状态"></div>
          <button class="quick-tool-action note-trigger" id="noteTrigger" type="button">＋ Point</button>
          <div class="quick-tools-footer">
            <div class="quick-undo-actions">
              <div class="quick-undo-list-wrap">
                <button class="quick-undo-list" id="undoHistoryTrigger" type="button" data-i18n-aria-label="undoList" aria-label="打开撤销列表" hidden><svg class="undo-list-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
              </div>
              <button class="quick-undo-latest" id="undoLatest" type="button" hidden><span data-i18n="undo">撤销</span><span id="undoLatestLabel"></span></button>
            </div>
            <button class="quick-tool-top" id="backToTop" type="button" data-i18n-aria-label="jumpTop" data-i18n-title="jumpTop" aria-label="回到开头" title="回到开头"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
          <div class="note-composer" id="noteComposer" hidden>
            <button class="plain-x note-close" id="noteClose" type="button" data-i18n-aria-label="closeNote" aria-label="关闭 Note">×</button>
            <textarea id="quickNoteInput" rows="2" data-i18n-placeholder="quickNotePlaceholder" placeholder="想到什么就记什么…"></textarea>
            <div class="inline-hint" data-i18n="quickNoteHint">输入即保存 · 日期是当前选中的那一天</div>
          </div>
        </div>
        <div class="undo-history" id="undoHistory" hidden><div class="undo-history-head"><strong data-i18n="recentChanges">最近修改</strong><button class="plain-x" id="undoHistoryClose" type="button" data-i18n-aria-label="closeNote" aria-label="Close">×</button></div><div class="undo-history-list" id="undoHistoryList"></div></div>
        <button class="quick-tools-toggle" id="quickToolsToggle" type="button" aria-expanded="false" aria-controls="quickToolsPanel"><span id="quickToolsLabel">未记录</span></button>
      </aside>
    </section>
  </main>

  <div class="sheet-backdrop" id="settingsSheet" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head"><h2 id="settingsTitle" data-i18n="settings">设置</h2><button class="plain-x" data-close-sheet="settingsSheet" data-i18n-aria-label="closeNote" aria-label="Close">×</button></div>
      <div class="locale-setting"><span data-i18n="language">界面语言</span><div class="locale-options" role="group" data-i18n-aria-label="language"><button id="localeZh" type="button" aria-pressed="true" data-i18n="simplifiedChinese">简体中文</button><button id="localeEn" type="button" aria-pressed="false" data-i18n="english">English</button></div></div>
      <p class="muted settings-hint" data-i18n="settingsHint">停用后只从快捷切换中移除，历史记录仍会保留。</p>
      <div id="stateSettings" class="state-settings"></div>
      <div class="add-state-row"><input id="newStateName" type="text" data-i18n-placeholder="addStatePlaceholder" placeholder="新 State 名称"><button class="secondary-btn" id="addStateBtn" type="button" data-i18n="add">添加</button></div>
      <div class="settings-section">
        <div class="settings-section-head"><h3 data-i18n="data">数据</h3><div class="settings-actions"><button class="secondary-btn" id="exportBtn" type="button" data-i18n="exportJson">导出 JSON</button><button class="secondary-btn" id="importBtn" type="button" data-i18n="importJson">导入 JSON</button><input id="importFile" type="file" accept="application/json" hidden></div></div>
        <p class="muted small" data-i18n="migrationHint">V4 保存 Switch / Stop 事件并由其派生 Range。V1–V3 可自动迁移。</p>
      </div>
      <div class="settings-version" id="settingsVersion">Life Trace · Stream V4.0.70</div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./js/storage.js?v=70"></script>
  <script src="./js/i18n.js?v=70"></script>
  <script src="./js/state.js?v=70"></script>
  <script src="./js/ui.js?v=70"></script>
  <script src="./js/app.js?v=70"></script>
</body>
</html>

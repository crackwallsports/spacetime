<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="State">
  <title>Life State</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    (function(){
      var mq=window.matchMedia('(prefers-color-scheme: light)');
      function sync(){document.documentElement.setAttribute('data-theme',mq.matches?'light':'dark');}
      sync(); window.__syncTheme=sync;
      try{mq.addEventListener('change',function(){sync();if(window.__onThemeChange)window.__onThemeChange();});}
      catch(e){mq.addListener(function(){sync();if(window.__onThemeChange)window.__onThemeChange();});}
    })();
  </script>
</head>
<body>
  <div id="ambient"></div>
  <div id="pulse"><div class="ring"></div></div>
  <div id="announce"></div>
  <div id="blackout"></div>

  <main class="wrap">
    <header class="top">
      <span class="brand">◉ Life State</span>
      <span class="spacer"></span>
      <button class="linkbtn" id="helpBtn">快捷键 <span class="kbd">?</span></button>
      <button class="linkbtn" id="manageBtn">状态设置</button>
    </header>

    <div class="recording-alert" id="recordingAlert">
      <span class="msg" id="recordingAlertText"></span>
      <button class="btn sm" id="recordingKeep">仍然正确</button>
      <button class="btn sm primary" id="recordingFix">结束并修正</button>
    </div>

    <section class="console" id="console" aria-live="polite">
      <div class="glow" id="glow"></div>
      <div class="cbody">
        <div class="cmeta">
          <div class="eyebrow"><span class="dot" id="led"></span><span id="eyebrow">未记录</span></div>
          <div class="state" id="stateName">未记录</div>
          <div class="since" id="since">开始记录后进入「迷茫」</div>
        </div>
        <div class="clockwrap">
          <div class="clocklab" id="clockLab">今日已记录</div>
          <div class="clock" id="clock">0:00</div>
        </div>
        <button class="switchbtn" id="switchBtn"><span class="led"></span><span id="switchTxt">开始记录</span></button>
      </div>
      <div class="stop-note" id="stopNote">停止记录只表示“未知/未记录”，不是休息状态。</div>
    </section>

    <section class="modes" id="modes" aria-label="状态"></section>

    <div class="hintbar">
      <span><span class="kbd">空格</span> 开始 / 停止记录</span><span class="sep"></span>
      <span><span class="kbd">1</span>–<span class="kbd">9</span> 切状态</span><span class="sep"></span>
      <span><span class="kbd">←</span><span class="kbd">→</span> 上一个 / 下一个</span><span class="sep"></span>
      <span><span class="kbd">R</span> 回迷茫</span>
    </div>

    <section>
      <div class="sectionhead">
        <h2>时间线</h2>
        <div class="days" id="days"></div>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>
  </main>

  <div class="modal-bg" id="helpModal">
    <div class="modal">
      <h3>键盘操作</h3><div id="helpList"></div>
      <div class="actions"><button class="btn primary" id="helpClose">知道了</button></div>
    </div>
  </div>

  <div class="modal-bg" id="manageModal">
    <div class="modal">
      <h3>状态设置</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">「迷茫」是开始记录后的默认未定义状态，不可删除。</p>
      <div id="manageList"></div>
      <div class="row" style="border:none;margin-top:12px;gap:8px">
        <input type="text" id="newName" placeholder="新增状态，如：阅读">
        <button class="btn primary" id="addBtn">添加</button>
      </div>
      <div class="actions">
        <button class="btn" id="exportBtn">导出数据</button>
        <button class="btn" id="importBtn">导入数据</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
        <button class="btn primary" id="manageClose">完成</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="editModal">
    <div class="modal">
      <h3>修正这段记录</h3>
      <p id="editHint" style="color:var(--muted);font-size:12.5px;margin-bottom:12px"></p>
      <div class="row">
        <span class="editlab">开始</span><input type="time" id="editStart">
        <span class="editlab">结束</span><input type="time" id="editEnd">
      </div>
      <div class="row"><span class="editlab">类型</span><div class="editchips" id="editChips"></div></div>
      <div class="actions">
        <button class="btn danger" id="editDelete">删除</button><span style="flex:1"></span>
        <button class="btn" id="editCancel">取消</button><button class="btn primary" id="editSave">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="undo-toast" id="undoToast"><span id="undoText"></span><button id="undoBtn">撤销</button></div>

  <script src="./js/storage.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
